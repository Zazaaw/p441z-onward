name: Presensi otomatis

# Jadwal GitHub Actions memakai UTC. WIB = UTC+7.
#
# Waktunya TIDAK simetris antara check-in dan check-out, karena aturan di
# endpoint memang berbeda:
#
#   check-in  : dilewati kalau menitSekarang > (checkin_selesai + 2 jam).
#               Datang lebih awal TIDAK masalah — jam yang dicatat diacak di
#               dalam jendela, bukan diambil dari jam saat cron jalan.
#
#   check-out : dilewati kalau menitSekarang < checkout_mulai.
#               Datang lebih awal DITOLAK, dan tidak ada batas atas — jadi
#               telat justru aman.
#
# Karena itu check-in dijadwalkan SEBELUM jendela, sedangkan check-out harus
# SESUDAH jendela terbuka. Versi sebelumnya menjadwalkan check-out 21:55
# padahal jendelanya baru buka 22:00, sehingga auto check-out tidak pernah
# jalan sama sekali.
#
# Masing-masing punya satu jadwal cadangan: GitHub bisa menunda atau bahkan
# melewatkan scheduled run saat antreannya padat. Menjalankan dua kali aman
# karena endpoint-nya idempoten — percobaan kedua membalas "sudah check-in"
# atau "presensi hari ini sudah lengkap" tanpa menulis apa pun.
on:
  schedule:
    # ── Check-in — jendela 07:30-07:45 WIB ──
    - cron: "25 0 * * 1-5"   # 07:25 WIB
    - cron: "10 1 * * 1-5"   # 08:10 WIB (cadangan, masih dalam tenggang 09:45)
    # ── Check-out — jendela 22:00-22:30 WIB ──
    - cron: "5 15 * * 1-5"   # 22:05 WIB
    - cron: "40 15 * * 1-5"  # 22:40 WIB (cadangan; telat tidak ditolak)
  # Supaya bisa diuji manual dari tab Actions tanpa menunggu jadwal.
  workflow_dispatch:
    inputs:
      dry:
        description: "Uji coba tanpa benar-benar presensi"
        type: boolean
        default: false

jobs:
  presensi:
    runs-on: ubuntu-latest
    steps:
      - name: Panggil endpoint cron
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${SITE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::SITE_URL atau CRON_SECRET belum diset di repository secrets."
            exit 1
          fi

          URL="$SITE_URL/api/cron"
          if [ "${{ inputs.dry }}" = "true" ]; then
            URL="$URL?dry=1"
            echo "Mode uji coba — tidak akan benar-benar presensi."
          fi

          # -sS: sunyi tapi tetap menampilkan galat. Body dipisah dari kode
          # status supaya keduanya bisa dilaporkan terpisah.
          BODY=$(mktemp)
          KODE=$(curl -sS -w "%{http_code}" -o "$BODY" \
            --retry 3 --retry-delay 20 --retry-all-errors \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$URL")

          echo "Kode status: $KODE"
          echo "Balasan:"
          cat "$BODY"
          echo ""

          # Endpoint membalas 200 juga saat memutuskan "lewat" (akhir pekan,
          # libur, otomasi mati) — itu bukan kegagalan.
          if [ "$KODE" != "200" ]; then
            echo "::error::Endpoint membalas $KODE, bukan 200."
            exit 1
          fi
